spring.application.name=Swarmwatch-svc
swarmwatch.gcp-project-id=${GCP_PROJECT_ID:}
swarmwatch.google-client-id=${GOOGLE_CLIENT_ID:}
swarmwatch.check-interval-seconds=${CHECK_INTERVAL_SECONDS:60}
swarmwatch.openai-base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
swarmwatch.inkbox-base-url=${INKBOX_BASE_URL:https://inkbox.ai/api/v1}
server.error.include-message=never
management.endpoints.web.exposure.include=health
server.port=${PORT:8080}
server.address=0.0.0.0
