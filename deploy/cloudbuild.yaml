steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file
      - Swarmwatch-svc/deploy/Dockerfile
      - --pull
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:${BUILD_ID}
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/app:${BUILD_ID}
serviceAccount: projects/${PROJECT_ID}/serviceAccounts/swarmwatch-build@${PROJECT_ID}.iam.gserviceaccount.com
substitutions:
  _REGION: us-central1
  _REPOSITORY: swarmwatch
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 1800s
